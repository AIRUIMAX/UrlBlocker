<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; }
        body { 
            width: 450px; 
            padding: 16px; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f8f9fa;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .header h3 {
            margin: 0;
            color: #2c3e50;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .header h4 {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            max-width: 100%;
            line-height: 1.4;
        }
        
        .refresh-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        .refresh-btn:hover {
            background-color: rgba(0,0,0,0.1);
        }
        
        .input-group {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }
        
        input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #007acc;
            box-shadow: 0 0 0 3px rgba(0,122,204,0.1);
        }
        
        input::placeholder {
            color: #6c757d;
        }
        
        .edit-mode {
            width: 100%;
        }
        
        .redirect-inputs-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .redirect-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .redirect-input-row .edit-input {
            flex: 1;
            margin-bottom: 0;
        }
        
        .add-redirect-btn {
            width: 100%;
            padding: 8px;
            background: #e9ecef;
            color: #495057;
            border: 2px dashed #adb5bd;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .add-redirect-btn:hover {
            background: #dee2e6;
            border-color: #6c757d;
        }
        
        .remove-redirect-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }
        
        .remove-redirect-btn:hover {
            background: #c82333;
        }
        
        .add-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #007acc, #005a9e);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .add-btn:hover {
            background: linear-gradient(135deg, #005a9e, #004080);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,122,204,0.3);
        }
        
        .add-btn:active {
            transform: translateY(0);
        }
        
        .url-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .url-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: block;
            transition: all 0.2s;
        }
        
        .url-item:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-1px);
        }
        
        .url-item.released {
            background: #f8f9fa;
            opacity: 0.7;
        }
        
        .url-content {
            cursor: pointer;
            min-height: 40px;
        }
        
        .url-content strong {
            color: #2c3e50;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .url-content span {
            color: #495057;
            font-size: 14px;
            word-break: break-all;
            display: block;
            margin-bottom: 8px;
        }

        .url-row-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .url-row-head > strong {
            display: inline;
            margin-bottom: 0;
        }

        .redirect-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            cursor: pointer;
            user-select: none;
        }

        .redirect-header strong {
            display: inline;
            margin-bottom: 0;
        }

        .redirect-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            padding: 0;
            background: #f1f3f5;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 10px;
            line-height: 1;
            color: #495057;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .redirect-toggle:hover {
            background: #e9ecef;
            border-color: #adb5bd;
            color: #007acc;
        }

        .redirect-toggle.open {
            transform: rotate(90deg);
        }

        .redirect-header .redirect-hint {
            display: inline;
            margin-bottom: 0;
            font-size: 12px;
            color: #6c757d;
        }

        /* 整块悬停变色，提示「可点击展开 / 收起」 */
        .redirect-header:hover strong,
        .redirect-header:hover .redirect-hint {
            color: #007acc;
        }

        .redirect-list {
            display: none;
            flex-direction: column;
            gap: 2px;
            margin-top: 4px;
        }

        .redirect-list.open {
            display: flex;
        }

        .redirect-list span {
            display: block;
            margin-bottom: 2px;
            font-size: 12px;
            color: #6c757d;
        }

        .url-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #e9ecef;
        }

        .actions-spacer {
            flex: 1;
        }
        
        .btn {
            padding: 7px 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
        }
        
        .release-btn {
            background: #28a745;
            color: white;
        }
        
        .release-btn:hover {
            background: #218838;
        }
        
        .visit-btn {
            background: #007bff;
            color: white;
        }
        
        .visit-btn:hover {
            background: #0056b3;
        }
        
        .delete-btn {
            background: #dc3545;
            color: white;
        }
        
        .delete-btn:hover {
            background: #c82333;
        }
        
        .save-btn {
            background: #28a745;
            color: white;
        }
        
        .cancel-btn {
            background: #6c757d;
            color: white;
        }
        
        .edit-input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #007acc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .edit-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,122,204,0.1);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }
        
        .empty-state p {
            margin: 0;
            font-size: 14px;
        }

        .url-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .url-list-header span {
            font-size: 13px;
            color: #6c757d;
        }

        .settings-link {
            background: none;
            border: none;
            color: #007acc;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }

        .settings-link:hover {
            color: #005a9e;
        }

        .reminder-toggle {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            border-radius: 6px;
            background: #f1f3f5;
            font-size: 12px;
            color: #495057;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .reminder-toggle:hover {
            background: #e9ecef;
        }

        .reminder-toggle input[type="checkbox"] {
            width: 14px;
            height: 14px;
            margin: 0;
            cursor: pointer;
        }

        .reminder-enabled {
            color: #28a745;
        }

        /* 设置弹窗 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-mask.show {
            display: flex;
        }

        .modal-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
            animation: modalIn 0.18s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-card h4 {
            margin: 0 0 16px 0;
            color: #2c3e50;
            font-size: 16px;
        }

        .modal-setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e9ecef;
            margin-bottom: 16px;
        }

        .modal-setting strong {
            display: block;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .modal-setting p {
            margin: 0;
            font-size: 12px;
            color: #6c757d;
        }

        .modal-control {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            font-size: 13px;
            color: #495057;
        }

        .modal-control input {
            width: 64px;
            margin-bottom: 0;
            padding: 8px;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-actions .btn {
            padding: 8px 16px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>🔗 URL 阻止器</h3>
        <h4 id="quoteText">意志不该被打败, 人生本应无限精彩</h4>
    </div>
    
    <div class="input-group">
        <input type="text" id="blockUrl" placeholder="要阻止的URL (例如: example.com)" />
        <input type="text" id="redirectUrl" placeholder="第一个重定向到的URL，编辑规则时可添加更多 (例如: https://google.com)" />
        <button id="addBtn" class="add-btn">➕ 添加阻止规则</button>
    </div>

    <div class="url-list-header">
        <span id="ruleCount">加载中...</span>
        <button id="openSettings" class="settings-link">⚙ 设置</button>
    </div>

    <div id="urlList" class="url-list"></div>

    <div id="settingsModal" class="modal-mask">
        <div class="modal-card">
            <h4>设置</h4>
            <div class="modal-setting">
                <div>
                    <strong>提醒间隔</strong>
                    <p>释放 URL 后，每隔多长时间提醒一次</p>
                </div>
                <div class="modal-control">
                    <input type="number" id="intervalInput" min="1" max="1440" value="15">
                    <span>分钟</span>
                </div>
            </div>
            <div class="modal-actions">
                <button id="cancelSettings" class="btn cancel-btn">取消</button>
                <button id="saveSettings" class="btn save-btn">保存</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
