<!DOCTYPE html>
<html>
<head>
    <title>URL Blocker 测试页面</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-link { display: block; margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; text-decoration: none; color: #333; }
        .test-link:hover { background: #e0e0e0; }

</head>
<body>
    <h1>URL Blocker 测试页面</h1>
    <p>点击以下链接测试URL拦截功能：</p>
    
    <a href="https://www.example.com" class="test-link" target="_blank">测试 example.com</a>
    <a href="https://www.google.com" class="test-link" target="_blank">测试 google.com</a>
    <a href="https://www.bing.com" class="test-link" target="_blank">测试 bing.com</a>
    
    <p>在扩展中添加这些URL的阻止规则，然后测试释放功能。</p>
</body>
</html>
